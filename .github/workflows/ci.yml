name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 本包零运行时依赖、没有 lockfile，直接跑测试与构建校验即可。
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Verify committed client bundle matches source
        run: npm run check
